name: 'Scrap Empire: probar rama'

# Prueba las ramas que tocan Scrap Empire antes de llevarlas a main (las sesiones sin npm local lo usan).
on:
  push:
    branches-ignore: [main, 'capturas*']
    paths: ['scrap-empire/**', '.github/workflows/scrap-empire-probar-rama.yml']
  pull_request:
    paths: ['scrap-empire/**', '.github/workflows/scrap-empire-probar-rama.yml']

permissions:
  contents: write

defaults:
  run:
    working-directory: scrap-empire

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      # Prueba de humo en Chromium sin pantalla: PC y móvil; capturas en «scrap-empire/smoke».
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-scrap-empire
          path: scrap-empire/smoke/
          retention-days: 7
      # Las capturas también se guardan en la rama «capturas-pruebas-scrap-empire» (las sesiones las miran desde ahí).
      - name: Subir capturas a la rama «capturas-pruebas-scrap-empire»
        if: always()
        run: |
          [ -d smoke ] || exit 0
          cd smoke
          git init -q
          git checkout -q -b capturas-pruebas-scrap-empire
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Capturas de Scrap Empire de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" capturas-pruebas-scrap-empire
