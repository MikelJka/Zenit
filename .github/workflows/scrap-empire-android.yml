name: 'Scrap Empire: Android (APK de prueba)'

# Empaqueta la web de Scrap Empire con Capacitor y genera un APK de depuración, que se descarga de los
# artefactos de la ejecución. El AAB firmado para Google Play llega cuando Mikel cree la clave (ver scrap-empire/docs/ANDROID.md).
on:
  workflow_dispatch:
  push:
    branches: ['sesion/**']
    paths: ['scrap-empire/capacitor.config.json', 'scrap-empire/package.json', 'scrap-empire/src/ui/ads.ts', 'scrap-empire/src/data/ads.json', '.github/workflows/scrap-empire-android.yml']

defaults:
  run:
    working-directory: scrap-empire

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: CAPACITOR=1 npm run build
      - run: npx cap add android
      - name: Identificador de la app de AdMob en el manifiesto (sin él la app se cierra al abrir)
        run: |
          APP_ID=$(node -p "require('./src/data/ads.json').androidAppId")
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: scrap-empire/android
      - uses: actions/upload-artifact@v4
        with:
          name: scrap-empire-debug-apk
          path: scrap-empire/android/app/build/outputs/apk/debug/app-debug.apk
