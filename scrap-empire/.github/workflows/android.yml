name: Android (APK de prueba)

# Empaqueta la web con Capacitor y genera un APK de depuración, que se descarga de los artefactos de la ejecución.
# El archivo firmado para Google Play (AAB) llega cuando Mikel cree la clave de firma (ver docs/ANDROID.md).
on:
  workflow_dispatch:
  push:
    branches: ['sesion/**']
    paths: ['capacitor.config.json', '.github/workflows/android.yml', 'package.json']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: CAPACITOR=1 npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: scrap-empire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
