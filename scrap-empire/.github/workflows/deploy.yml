name: Probar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}
      # Capturas de la versión publicada en la rama «capturas» (las lee el módulo Zenit Studio de STONKS).
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Subir capturas a la rama «capturas»
        run: |
          cd smoke
          git init -q
          git checkout -q -b capturas
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Capturas de main (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" capturas
      # Prueba de gráficos del juego espacial (PixiJS), para abrirla en el móvil: /prototipos/espacio/
      - name: Prototipo de gráficos del juego espacial
        run: |
          cd space-harvest/prototipos/espacio-pixi
          npm install
          npm run build
          mkdir -p ../../../dist/prototipos/espacio
          cp -r dist/. ../../../dist/prototipos/espacio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
