<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenit Studio</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #15130f; color: #e8e0d0; font: 16px/1.5 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    main { width: min(560px, 100% - 32px); padding: 32px 0; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p { margin: 0 0 24px; color: #b5aa96; }
    a.juego { display: block; padding: 16px; margin-bottom: 12px; border: 1px solid #4a4236; border-radius: 10px; background: #211d17; color: inherit; text-decoration: none; }
    a.juego:hover, a.juego:focus { border-color: #c98a3a; }
    a.juego strong { display: block; font-size: 1.15rem; color: #e9a85a; }
  </style>
</head>
<body>
  <main>
    <h1>Zenit Studio</h1>
    <p>Juegos de Mikel para navegador.</p>
    <!-- Un enlace por juego publicado (ver web/juegos.txt). -->
    <a class="juego" href="./oxido/">
      <strong>Óxido</strong>
      Gestión de colonia postapocalíptica en pixel art, para móvil y PC.
    </a>
  </main>
</body>
</html>
