<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070f" />
  <title>Space Harvest</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; color: #eaf2ff; }
    #game { position: fixed; inset: 0; }
    #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px; padding: 24px 20px calc(48px + env(safe-area-inset-bottom)); pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #tagline { font-size: 1.1rem; text-align: center; max-width: 22em; text-shadow: 0 2px 8px #000; }
    #summary { font-size: 1rem; opacity: .85; }
    button { font: inherit; min-height: 48px; min-width: 48px; padding: 0 28px; border-radius: 28px; border: 2px solid #8fd0ff; background: #0d2a4a; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
    #play { font-size: 1.5rem; font-weight: 700; min-height: 60px; width: min(80vw, 320px); background: #1c6fd1; letter-spacing: .08em; }
    #settings-btn { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; padding: 0; width: 48px; border-radius: 50%; font-size: 1.4rem; }
    #settings { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000a; }
    #settings.open { display: flex; }
    #panel { background: #0a1426; border: 2px solid #8fd0ff; border-radius: 16px; padding: 20px; width: min(88vw, 360px); display: flex; flex-direction: column; gap: 12px; }
    #panel h2 { margin: 0 0 4px; font-size: 1.3rem; }
    #panel .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 1.05rem; }
    #panel button { padding: 0 16px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui">
    <div id="tagline"></div>
    <button id="play"></button>
    <div id="summary"></div>
  </div>
  <button id="settings-btn" aria-label="Ajustes">⚙</button>
  <div id="settings"><div id="panel"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
